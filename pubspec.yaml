name: easy_help
description: "Guardian Safety - Personal Safety & Emergency Response App"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Core & Firebase ---
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_auth: ^6.5.7
  firebase_storage: ^13.5.0
  shared_preferences: ^2.3.2
  flutter_background_service: ^5.0.0

  # --- Sensors & Location ---
  sensors_plus: ^5.0.1
  geolocator: ^14.0.3
  google_maps_flutter: ^2.5.3
  flutter_riverpod: ^2.6.1
  # --- Utilities, AI, Mesh & Communication ---
  permission_handler: ^11.4.0
  url_launcher: ^6.3.2
  background_sms: ^0.0.4
  fast_contacts: ^6.0.0
  google_generative_ai: ^0.4.7
  nearby_connections: ^4.2.1
  connectivity_plus: ^6.0.0

  # --- Local Offline AI Stack ---
  tflite_flutter: ^0.11.0
  whisper_ggml_plus: ^1.5.2

  # --- Audio & File System ---
  record: ^5.0.4
  path_provider: ^2.1.2

  # --- UI Icons & Notifications ---
  cupertino_icons: ^1.0.8
  flutter_local_notifications: ^22.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_platform_interface: 1.5.0
  record_linux: 0.7.0
  record_web: 1.2.0
  record_windows: 1.0.6

flutter:
  uses-material-design: true

  # Folder & explicit model assets for 100% offline edge execution
  assets:
    - assets/models/
    - assets/models/yamnet.tflite
    - assets/models/yamnet_labels.txt
    - assets/models/ggml-tiny.bin